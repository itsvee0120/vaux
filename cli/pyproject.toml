[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaux-cli"
version = "0.1.28"
description = "A terminal client for vaux listening rooms."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Violet Nguyen", email = "nviolet0120@gmail.com" },
]
license = { text = "MIT" }
dependencies = [
    "click",
    "textual",
    "python-socketio",
    "httpx",
    "aiohttp",
    "websockets",
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/itsvee0120/vaux"

[project.scripts]
vaux = "main:cli"

[tool.setuptools]
packages = ["vaux"]
py-modules = ["main"]